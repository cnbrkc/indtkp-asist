name: Testler

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --disable-pip-version-check -r requirements.txt
      - name: Birim ve uçtan uca testler
        env:
          PYTHONUNBUFFERED: "1"
        run: python -m unittest discover -s tests -v
      - name: Depodaki config.json'ı doğrula
        env:
          API_ID: "12345678"
          API_HASH: "00000000000000000000000000000000"
          SESSION_STRING: "placeholder"
          PYTHONUNBUFFERED: "1"
        run: python -u bot.py --check
