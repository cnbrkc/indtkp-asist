name: epey-test
on:
  workflow_dispatch:
    inputs:
      url:
        description: Epey linki
        required: true
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - name: Dene
        env:
          URL: ${{ github.event.inputs.url }}
        run: |
          curl -s -o out.html -w "KOD: %{http_code}\n" \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36" \
            -H "Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8" \
            -H "Accept-Language: tr-TR,tr;q=0.9,en;q=0.8" \
            -H "Sec-Fetch-Dest: document" \
            -H "Sec-Fetch-Mode: navigate" \
            -H "Sec-Fetch-Site: none" \
            -H "Upgrade-Insecure-Requests: 1" \
            "$URL"
          echo "kargodahil satir sayisi:"
          grep -c 'kargodahil' out.html || true
          echo "--- cevabin basi ---"
          head -c 600 out.html
