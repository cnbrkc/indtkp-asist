name: epey-test
on:
  workflow_dispatch:
    inputs:
      url:
        description: "Epey ürün sayfası linki"
        required: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Sayfayı çek
        run: |
          curl -s -L -o sayfa.html -w "HTTP durum kodu: %{http_code}\n" \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124.0 Safari/537.36" \
            "${{ github.event.inputs.url }}"
          echo "Sayfa boyutu:"
          wc -c sayfa.html

      - name: Fiyat geçen satırlar
        run: |
          grep -i -E "TL|fiyat|price" sayfa.html | head -n 40 | cut -c1-300
