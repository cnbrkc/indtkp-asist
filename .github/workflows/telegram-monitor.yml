name: Telegram indirim takipçisi

on:
  workflow_dispatch:
  schedule:
    # GitHub cron kesin dakik değildir; ücretsiz runner'ı yaklaşık 5 saat 45 dk çalıştır.
    - cron: "7 */6 * * *"

concurrency:
  group: telegram-monitor
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    # contents: write → Telegram'dan gelen ayar değişiklikleri (/ayar_set …)
    # config.json'a yazıldıktan sonra depoya geri işlenebilsin.
    permissions:
      contents: write
    env:
      # Log satırlarının tamponda bekleyip Actions ekranında gecikmemesi için.
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --disable-pip-version-check -r requirements.txt
      # Secret/config eksikse Telegram'a hiç bağlanmadan, okunabilir bir raporla dur.
      # (Eksik API_HASH yüzünden haftalarca sessizce çöken çalışmaları bu adım yakalar.)
      - name: Ayarları doğrula
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          SESSION_STRING: ${{ secrets.SESSION_STRING }}
          GH_PAT: ${{ secrets.GH_PAT }}
          RESTART_AFTER_MINUTES: 330
        run: python -u bot.py --check
      - name: Mesajları dinle
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          SESSION_STRING: ${{ secrets.SESSION_STRING }}
          GH_PAT: ${{ secrets.GH_PAT }}
          # Telegram'dan değiştirilen ayarların config.json'a yazıldıktan sonra
          # depoya işlenmesi için (yoksa değişiklik yalnızca o oturumda kalır).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_WORKFLOW_FILE: telegram-monitor.yml
          RESTART_AFTER_MINUTES: 330
        run: python -u bot.py
