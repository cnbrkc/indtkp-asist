name: Telegram indirim takipçisi

on:
  workflow_dispatch:
  schedule:
    # GitHub cron kesin dakik değildir; ücretsiz runner'ı yaklaşık 5 saat 45 dk çalıştır.
    - cron: "7 */6 * * *"

concurrency:
  group: telegram-monitor
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions: {}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --disable-pip-version-check -r requirements.txt
      - name: Mesajları dinle
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          SESSION_STRING: ${{ secrets.SESSION_STRING }}
        run: python bot.py
