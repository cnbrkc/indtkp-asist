name: Telegram indirim takipçisi

on:
  workflow_dispatch:
  schedule:
    # Bekçi (watchdog): çalışan bir iş varken tetiklenen cron SIRAYA girer (concurrency,
    # cancel-in-progress=false) ve çalışanı kesmez; yalnızca bekleyen tek bir yedek tutulur.
    # Runner beklenmedik biçimde ölürse ("runner lost communication") bekleyen yedek hemen
    # devralır. GitHub cron'ları sık düşürdüğü için yarım saatte bir tetiklenir.
    - cron: "7,37 * * * *"

concurrency:
  group: telegram-monitor
  # Cron is a safety net, not a reason to interrupt an active delivery queue.
  # Explicit /restart and manual dispatch still replace the current runner.
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' }}

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    # contents: write → Telegram'dan gelen ayar değişiklikleri (/ayar_set …)
    # config.json'a yazıldıktan sonra depoya geri işlenebilsin.
    permissions:
      contents: write
    env:
      # Log satırlarının tamponda bekleyip Actions ekranında gecikmemesi için.
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --disable-pip-version-check -r requirements.txt
      # Secret/config eksikse Telegram'a hiç bağlanmadan, okunabilir bir raporla dur.
      # (Eksik API_HASH yüzünden haftalarca sessizce çöken çalışmaları bu adım yakalar.)
      - name: Ayarları doğrula
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          SESSION_STRING: ${{ secrets.SESSION_STRING }}
          GH_PAT: ${{ secrets.GH_PAT }}
          NOTIFY_BOT_TOKEN: ${{ secrets.NOTIFY_BOT_TOKEN }}
          RESTART_AFTER_MINUTES: 330
        run: python -u bot.py --check
      - name: Mesajları dinle
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          SESSION_STRING: ${{ secrets.SESSION_STRING }}
          GH_PAT: ${{ secrets.GH_PAT }}
          NOTIFY_BOT_TOKEN: ${{ secrets.NOTIFY_BOT_TOKEN }}
          # Telegram'dan değiştirilen ayarların config.json'a yazıldıktan sonra
          # depoya işlenmesi için (yoksa değişiklik yalnızca o oturumda kalır).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_WORKFLOW_FILE: telegram-monitor.yml
          RESTART_AFTER_MINUTES: 330
        run: python -u bot.py
