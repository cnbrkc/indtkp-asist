name: Toplayıcı teşhisi (Cimri/Epey)

# Elle veya teşhis dosyaları değişen PR'larda çalışır. Secret yok, Telegram
# yok, zamanlanmış görev yok.
# Amaç: "Epey okunamadı" gibi bir hatanın NEDENİNİ görmek. Worker ne görüyorsa
# (HTTP kodu, boyut, engel işareti, yönlendirme) burada aynısı raporlanır.
on:
  # PR tetikleyicisi: teşhis aracı değiştiğinde ölçüm kendiliğinden koşsun.
  # Yalnız teşhis dosyaları değişince ve yalnız 2 sabit URL ile — gürültü/ban yok.
  pull_request:
    paths:
      - tools/aggregator_diag.py
      - tools/browser_probe.py
      - .github/workflows/aggregator-probe.yml
  workflow_dispatch:
    inputs:
      urls:
        description: >
          Ürün URL'leri (tek satır; boşluk veya virgülle ayır).
          Ör. "https://www.epey.com/televizyon/tcl-65c6k.html https://www.cimri.com/..."
        required: true
        type: string
      attempts:
        description: Her URL için kaç istek (aralarda 12 sn bekleme)
        required: false
        default: "1"
        type: string

permissions: {}

concurrency:
  group: aggregator-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Teşhis
        env:
          URLS: ${{ inputs.urls }}
          ATTEMPTS: ${{ inputs.attempts }}
        run: |
          set -euo pipefail
          python - "$URLS" "$ATTEMPTS" <<'PY'
          import json, subprocess, sys, time

          raw, attempts = sys.argv[1], max(1, min(3, int(sys.argv[2] or 1)))
          urls = [u for u in raw.replace(',', ' ').split() if u.startswith('http')]
          if not urls:
              # PR tetiklemesinde input yok: ölçüm için bilinen iki ürün.
              urls = [
                  'https://www.epey.com/televizyon/tcl-65c6k.html',
                  'https://www.cimri.com/televizyonlar/en-ucuz-tcl-65c6k-65-inc-'
                  '165-ekran-4k-ultra-hd-android-qd-miniled-tv-fiyatlari,2478359134',
              ]
              print('input yok → varsayılan 2 URL kullanılıyor', flush=True)

          for url in urls:
              print(f'\n## {url}', flush=True)
              for attempt in range(1, attempts + 1):
                  # Worker'ın gerçek sözleşmesi: izole süreç, JSON çıktı.
                  started = time.monotonic()
                  proc = subprocess.run([sys.executable, '-I', 'aggregator_worker.py', url],
                                        capture_output=True, text=True, timeout=60)
                  elapsed = int((time.monotonic() - started) * 1000)
                  payload = proc.stdout.strip() or '(çıktı yok)'
                  print(f'  deneme {attempt}: {elapsed} ms · çıkış={proc.returncode}', flush=True)
                  print(f'  {payload[:400]}', flush=True)
                  if proc.stderr.strip():
                      print(f'  stderr: {proc.stderr.strip()[:300]}', flush=True)
                  # Worker neyi gördüğünü söyleyemiyorsa ham HTTP'ye bak.
                  if not payload.startswith('{"ok": true'):
                      print('  --- ham HTTP ---', flush=True)
                      probe = subprocess.run(
                          [sys.executable, '-I', 'tools/store_probe.py', '--url', url,
                           '--out', '/tmp/probe'], capture_output=True, text=True, timeout=120)
                      print((probe.stdout or '')[-1500:], flush=True)
                      if probe.stderr.strip():
                          print('  probe stderr:', probe.stderr.strip()[:400], flush=True)
                  else:
                      print('  ✅ okundu', flush=True)
                  if attempt < attempts:
                      time.sleep(12)
          PY
      - name: Chrome TLS taklidi için curl_cffi (ücretsiz, teşhis için)
        if: always()
        run: |
          set -euo pipefail
          # 7-8. varyantlar Chrome/Safari TLS parmak izini taklit eder. Paket
          # kurulamazsa diag bunu "curl_cffi kurulu değil" diye dürüstçe yazar,
          # iş başarısız olmaz — teşhis aracı asla koşuyu düşürmemeli.
          python -m pip install --quiet --disable-pip-version-check curl_cffi \
            || echo "::warning::curl_cffi kurulamadı; 7-8. varyant atlanacak"

      - name: Başlık ve IP testi (403'ün nedeni)
        if: always()
        env:
          URLS: ${{ inputs.urls }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Python tek satırlık komut (-c) YAML blok girintisini bozar; dosyaya yaz.
          python - <<'PY' > /tmp/diag_args.txt
          import os
          urls = [u for u in os.environ.get('URLS', '').replace(',', ' ').split()
                  if u.startswith('http')]
          if not urls:                       # PR tetiklemesi: varsayılan ürünler
              urls = [
                  'https://www.epey.com/televizyon/tcl-65c6k.html',
                  'https://www.cimri.com/televizyonlar/en-ucuz-tcl-65c6k-65-inc-'
                  '165-ekran-4k-ultra-hd-android-qd-miniled-tv-fiyatlari,2478359134',
              ]
          print(' '.join(f'--url {u}' for u in urls))
          PY
          # ÖNEMLİ: annotation satırları (::notice/::warning) STDOUT'a gitmeli.
          # Bir dosyaya yönlendirilirse GitHub onları hiç görmez (2026-11-08 dersi).
          xargs python -I tools/aggregator_diag.py --annotate \
              --summary-out /tmp/diag.md --json-out /tmp/diag.json \
              < /tmp/diag_args.txt || true
          cat /tmp/diag.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

      - name: Gerçek tarayıcı testi (JS challenge'ı geçebiliyor mu?)
        if: always()
        env:
          URLS: ${{ inputs.urls }}
        run: |
          set -euo pipefail
          # Runner'da Chrome kurulu (google-chrome). Challenge'ı yalnız gerçek
          # tarayıcı çözebilir; bu adım "veri merkezi IP'sinden geçilebiliyor mu"
          # sorusunu kesin yanıtlar.
          python -m pip install --quiet --disable-pip-version-check nodriver \
            || echo "::warning::nodriver kurulamadı; tarayıcı testi atlanacak"
          python - <<'PY' > /tmp/bp_args.txt
          import os
          urls = [u for u in os.environ.get('URLS', '').replace(',', ' ').split()
                  if u.startswith('http')]
          if not urls:
              urls = [
                  'https://www.epey.com/televizyon/tcl-65c6k.html',
                  'https://www.cimri.com/televizyonlar/en-ucuz-tcl-65c6k-65-inc-'
                  '165-ekran-4k-ultra-hd-android-qd-miniled-tv-fiyatlari,2478359134',
              ]
          print(' '.join(f'--url {u}' for u in urls))
          PY
          xargs python -I tools/browser_probe.py --timeout 45               --summary-out /tmp/browser.md < /tmp/bp_args.txt || true
          cat /tmp/browser.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

      - name: Özet
        if: always()
        run: echo "Teşhis tamam. Ayrıntı yukarıdaki log'da." >> "$GITHUB_STEP_SUMMARY"
